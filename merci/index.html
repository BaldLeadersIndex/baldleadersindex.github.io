<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; font-src 'self'; media-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#071a3d">
  <meta name="robots" content="noindex,follow">
  <title>Merci — Bald Leaders Index</title>
  <link rel="icon" href="../favicon.ico?v=2" sizes="any">
  <style>
    :root{--navy:#071a3d;--blue:#226bc1;--ink:#0b1d3a;--muted:#5d6d83;--line:#d7e1ed;--green:#13825c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 75% 20%,#dcecff,transparent 32%),linear-gradient(180deg,#f8fbff,#eef4fb)}
    main{width:min(680px,100%);padding:clamp(30px,7vw,64px);text-align:center;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 28px 80px #071a3d1c}
    img{width:88px;height:88px;object-fit:contain} .check{width:58px;height:58px;margin:24px auto 18px;display:grid;place-items:center;border-radius:50%;background:#e8f7f0;color:var(--green);font-size:1.8rem;font-weight:900}
    h1{margin:0;font-size:clamp(2.3rem,7vw,4rem);line-height:1;letter-spacing:-.045em}p{margin:22px auto;color:var(--muted);font-size:1.08rem;max-width:520px}
    .note{padding:14px 16px;border-radius:12px;background:#eef4fb;font-size:.9rem}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:800}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    small{display:block;margin-top:28px;color:#7a889a}
  </style>
</head>
<body>
  <main>
    <img src="../public/bald-leaders-logo.webp" alt="Logo Bald Leaders Index">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Merci pour votre participation</h1>
    <p>Votre réponse a bien été transmise. Elle contribuera uniquement aux statistiques agrégées de l’étude.</p>
    <p class="note">Aucun nom, e-mail ou photo n’a été demandé.</p>
    <div class="actions"><a class="primary" href="../">Retour à l’accueil</a><a href="https://www.youtube.com/@martyetcie.officiel">Marty &amp; Cie sur YouTube</a></div>
    <small>Bald Leaders Index — étude citoyenne indépendante</small>
  </main>
</body>
</html>
